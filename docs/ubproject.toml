"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# Build-context tags, available as `build_tags` in filter/variant expressions.
build_tags = ["html"]

[source]
extend_exclude = ["README.md", "_build"]

# Run with `ubc script <name>` (e.g. `ubc script build`).
[scripts]
# Build with ubCode:
build = "ubc build index ."
# Lint the project; fail on any warning or worse.
check = "ubc check --deny warning"
# Static HTML site into _build/html; fails on any warning by default.
html = "ubc build html"
# What CI runs: lint first, then build the site.
ci = { chain = ["check", "html"] }
needs = "ubc build needs -o needs.json"
documents = "ubc build list-documents --parser"
report = "ubc report needs_overview.html.j2"
# Build with Sphinx + Sphinx-Needs (requires https://docs.astral.sh/uv).
# sphinx-needs >= 8.2 for the variant data (`variant_data*`, `parse_variants`);
# no upper bound so it tracks releases (verified against sphinx-needs 8.5.0).
sphinx = "uv run --no-project --with 'sphinx,sphinx-needs>=8.2,myst-parser' sphinx-build -W -b html . _build"
rm_build = "rm -rf _build"
"sphinx:clean" = { chain = ["rm_build", "sphinx"] }

# Mixed authoring: reStructuredText *and* Markdown (MyST) in one project.
# Declaring parsers switches on "parser mode"; each discovered file is routed to
# a parser by its include globs (`*.rst` -> RST, `*.md` -> MyST).
[parse.parsers.rst]

[parse.parsers.md]
flavour = "myst"

[[needs.types]]
directive = "req"
title = "Requirement"
prefix = "REQ_"

[[needs.types]]
directive = "spec"
title = "Specification"
prefix = "SPEC_"

[[needs.types]]
directive = "test"
title = "Test"
prefix = "TEST_"

[needs]
# Base "150%" variant data shared by every build (see variants.json), with
# inline overrides below.
variant_data_file = "variants.json"

# Traceability links between needs (dict form, the recommended style).
[needs.links.implements]
outgoing = "Implements"
incoming = "Implemented by"

[needs.links.tests]
outgoing = "Tests"
incoming = "Tested by"

[needs.variant_data]
edition = "pro"

# `parse_variants = true` enables `<<...>>` variant functions and
# `<{ var.* }>` variant-data references in the field's value.
[needs.fields.status]
parse_variants = true
default = ""

[needs.fields.platform_note]
description = "Note describing the active platform"
type = "string"
nullable = true
default = ""
parse_variants = true
