# Own criteria pack for `dec` (plan 001 §5.4), based on the installed
# `decision.toml` (vmodel profile, left untouched so `ubc agent update` stays
# conflict-free). Same axes; type renamed to `dec`.
#
# Every axis is judgment-only and scored 0..2 (2 = fully meets, 1 = partial,
# 0 = the fail condition).

guidance = """
- Fail closed: when genuinely uncertain whether an axis is met, score it 0 \
rather than giving the benefit of the doubt, and explain the uncertainty in \
your reasoning.
- Be lenient with domain-specific terminology and abbreviations — assume \
they are defined elsewhere in the project (e.g. a glossary) rather than \
penalizing the decision for using them without a local definition.
- A short, clear decision is not inherently deficient — judge substance, \
not length; a crisp Context/Alternatives/Consequences/Rationale can score \
full marks on every axis.
- If the decision's body is empty or unreadable, score every axis 0 and \
say so — there is nothing else to judge."""

[[criterion]]
id = "context_present"
name = "Context Present"
description = """
Whether a Context section explains the problem and the constraints that \
drove the decision."""
scoring_guide = """
0: No Context section is present, or it merely restates the title without explaining the underlying problem or constraints.
1: A Context section is present but is thin — it names the problem without the constraints that drove the decision, or vice versa.
2: A Context section clearly explains both the problem and the constraints that drove the decision."""
max_score = 2

[[criterion]]
id = "alternatives_listed"
name = "Alternatives Listed"
description = "Whether at least two alternatives, including the chosen one, are enumerated."
scoring_guide = """
0: Only one option is presented, or the listed alternatives are too vague to distinguish from one another.
1: At least two alternatives are listed, but one is described too thinly to judge on its own merits.
2: At least two genuine, clearly described alternatives (including the chosen one) are enumerated."""
max_score = 2

[[criterion]]
id = "consequences_present"
name = "Consequences Present"
description = """
Whether the decision describes what changes, the trade-offs accepted, and \
any follow-on work."""
scoring_guide = """
0: The decision states no consequences at all, or lists only positives with no trade-off language.
1: Consequences are stated but incompletely — e.g. the trade-offs are named but follow-on work is not, or vice versa.
2: The decision clearly describes what changes, the trade-offs accepted, and any follow-on work."""
max_score = 2

[[criterion]]
id = "rationale_quality"
name = "Rationale Quality"
description = """
Whether the rationale for the chosen option over the alternatives is \
explicit and coherent."""
scoring_guide = """
0: The rationale is circular (e.g. "X because X is better") or is an ungrounded subjective preference.
1: A rationale is given, but it leans on an unstated assumption or omits how the alternatives compare.
2: The rationale for choosing this option over the alternatives is explicit, coherent, and grounded."""
max_score = 2
